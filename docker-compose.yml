services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mercado_jogadores}
      POSTGRES_USER: ${POSTGRES_USER:-mercado_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mercado_password_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mercado_jogadores}
      POSTGRES_USER: ${POSTGRES_USER:-mercado_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mercado_password_local}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres-data:
